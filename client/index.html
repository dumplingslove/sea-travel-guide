      <h1>东南亚20天旅行指南 · 美食</h1>
      <p>8 城必吃品类（只讲品类，不点名具体餐厅）：</p>
      <ul>
        <li>曼谷：船面（小碗浓汤，一顿炫十几碗）；冬阴功、泰式炒河粉 pad thai、青木瓜沙拉 som tum；猪脚饭、泰式奶茶、芒果糯米饭；耀华力唐人街夜市</li>
        <li>清迈：考索伊 khao soi（泰北咖喱面）；泰北香肠 sai oua、泰北辣酱配炸猪皮；周日夜市、宁曼路咖啡</li>
        <li>普吉：海鲜大排档（芭东/Naka 夜市）；普吉福建面、洛克面 lo bak；热带水果（山竹、红毛丹当季）</li>
        <li>槟城：亚参叻沙 assam laksa；炒粿条 char kway teow、福建虾面；娘惹糕、煎蕊 cendol、鸭粥；Gurney 夜市</li>
        <li>吉隆坡：肉骨茶 bak kut teh（巴生胡椒派 vs 瓦煲药材派）；椰浆饭 nasi lemak、roti canai、咖喱面；亚罗街夜市、茨厂街</li>
        <li>胡志明市：越南粉 pho、法棍 banh mi；越式煎饼 banh xeo、春卷、甘蔗虾；滴漏咖啡 ca phe sua da</li>
        <li>富国岛：杨东夜市海鲜（海胆、生蚝、海鲜火锅）；bún quậy 富国特色面；富国鱼露</li>
        <li>新加坡：熟食中心文化（麦士威、老巴刹、阿美横）；海南鸡饭、肉骨茶、叻沙、辣椒螃蟹、咖椰吐司、鱼头米粉</li>
      </ul>
      <p>叻沙 / 肉骨茶 / 海南鸡饭在槟城、吉隆坡、新加坡是三个版本，一路对比着吃。</p>
